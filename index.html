<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08070b">
  <title>Inner Ascent</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #eee8e2;
      background:
        radial-gradient(circle at 50% 115%, #39192e 0, transparent 42%),
        linear-gradient(#08070b, #100b12);
    }
    main { max-width: 46rem; padding: 2rem; text-align: center; }
    p:first-child { color: #a68f9d; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: .3em 0; font-family: Georgia, serif; font-size: clamp(3.5rem, 12vw, 8rem); font-weight: 400; letter-spacing: -.055em; line-height: .82; }
    p:last-child { color: #a99fa7; font-size: clamp(1rem, 2vw, 1.2rem); }
    .mark { display: block; width: 1px; height: 8rem; margin: 2rem auto 0; background: linear-gradient(#8c405f, transparent); }
  </style>
</head>
<body>
  <main>
    <p>A new project</p>
    <h1>Inner<br>Ascent</h1>
    <p>Something is awakening within.</p>
    <span class="mark" aria-hidden="true"></span>
  </main>
</body>
</html>
